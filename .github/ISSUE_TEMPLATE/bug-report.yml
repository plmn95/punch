name: Bug report
description: Report a reproducible Punch problem without real customer data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, customer data, private pages or provider payloads.
  - type: input
    id: version
    attributes:
      label: Punch version or commit
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal fictional reproduction
      description: Use example.com URLs or newly fictional local fixtures.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
